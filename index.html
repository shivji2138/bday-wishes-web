<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise 🎉</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        .balloon {
            position: absolute;
            bottom: -40px;
            font-size: 2rem;
            animation: floatUp linear forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-gradient-to-tr from-rose-500 via-fuchsia-600 to-indigo-700 min-h-screen flex items-center justify-center">

    <!-- Balloons -->
    <div id="balloon-container" class="fixed inset-0 pointer-events-none"></div>

    <!-- Card -->
    <div class="relative z-10 bg-white/20 backdrop-blur-xl p-10 rounded-3xl shadow-2xl text-center text-white w-[90%] max-w-md">

        <div class="text-5xl mb-4">🎉</div>
        <p class="text-3xl md-3"> Enter your name to reveal <br> surprise from Shiva Akash</p>

        <!-- Hidden initially -->
        <h1 id="title" class="text-3xl font-bold mb-3 hidden">
            Happy Birthday 🎂
        </h1>

        <p id="name_op" class="text-2xl font-semibold mb-4 hidden"></p>

        <input 
            type="text"
            id="name_input"
            placeholder="Enter Your Name"
            class="w-full p-3 rounded-xl text-black outline-none text-center"
        >

    </div>

    <script>
        const nameInput = document.getElementById("name_input");
        const nameOutput = document.getElementById("name_op");
        const title = document.getElementById("title");

        nameInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && nameInput.value.trim() !== "") {

                // Show text
                title.classList.remove("hidden");
                nameOutput.classList.remove("hidden");

                // Animate
                title.classList.add("animate__animated", "animate__fadeInDown");
                nameOutput.classList.add("animate__animated", "animate__fadeInUp");

                nameOutput.textContent = nameInput.value;

                // Optional: hide input after submit
                nameInput.style.display = "none";
            }
        });

        function createBalloon() {
            const container = document.getElementById("balloon-container");
            const balloon = document.createElement("div");
            const emojis = ["🎈", "✨", "💖", "🧁", "⭐", "🍭"];

            balloon.className = "balloon";
            balloon.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            balloon.style.left = Math.random() * 100 + "vw";
            balloon.style.animationDuration = (Math.random() * 3 + 4) + "s";

            container.appendChild(balloon);

            setTimeout(() => balloon.remove(), 7000);
        }

        setInterval(createBalloon, 400);
    </script>

</body>
</html>
